services:
  backend:
    image: jjsalustiano/conectaedubackend-java:latest
    container_name: conectaedu-backend

    expose:
      - "8080"

    volumes:
      - /home/opc/app/wallet:/app/wallet

    environment:
      JAVA_OPTS: "-Xms128m -Xmx200m"
      SPRING_PROFILES_ACTIVE: dev

      app_frontend_url: ${app_frontend_url}

      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: ${DB_URL}

      APP_PASSWORD: ${APP_PASSWORD}
      TNS_ADMIN: /app/wallet

      JWT_SECRET: ${JWT_SECRET}

    restart: unless-stopped

  frontend:
    image: jjsalustiano/conectaedufrontend-react:latest
    container_name: conectaedu-frontend
    environment:
      app_frontend_url:

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

    restart: unless-stopped