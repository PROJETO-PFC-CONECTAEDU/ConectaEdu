name: Deploy Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: jjsalustiano/conectaedubackend-java:latest

      - name: Build e Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: jjsalustiano/conectaedufrontend-react:latest
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código (para pegar o docker-compose.yml)
        uses: actions/checkout@v4

      - name: Executar comandos na VM via SSH (Preparar diretório)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            mkdir -p ~/app

      - name: Copiar docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Executar comandos na VM via SSH (Deploy)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            cd ~/app

            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            cat <<EOF > .env
            SPRING_PROFILES_ACTIVE=prod
            DB_USER=ADMIN
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_FRONTEND_URL=${{ secrets.app_frontend_url }}
            DB_URL=${{ secrets.DB_URL }}
            TNS_ADMIN=/app/wallet
            APP_USERNAME=${{ secrets.APP_USERNAME }}
            APP_PASSWORD=${{ secrets.APP_PASSWORD }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            docker-compose down --remove-orphans --volumes
            docker-compose pull
            docker-compose up -d
            docker image prune -af
          
            
